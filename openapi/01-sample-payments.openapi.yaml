openapi: 3.1.0
info:
  title: Sample Payments API
  version: 1.0.0
  description: >
    Example third-party payment API for the Scalar portal scaffold.
    Replace with a real vendor OpenAPI document.
servers:
  - url: https://api.payments.example.com/v1
    description: Production
security:
  - ApiKeyAuth: []
paths:
  /charges:
    post:
      operationId: createCharge
      summary: Create a charge
      tags:
        - Charges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChargeRequest"
            example:
              amount: 1999
              currency: usd
              customer_id: cus_abc123
      responses:
        "201":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listCharges
      summary: List charges
      tags:
        - Charges
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: customer_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated charges
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Charge"
  /charges/{charge_id}:
    get:
      operationId: getCharge
      summary: Retrieve a charge
      tags:
        - Charges
      parameters:
        - name: charge_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Charge details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    CreateChargeRequest:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: Amount in the smallest currency unit (e.g. cents)
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
        customer_id:
          type: string
        description:
          type: string
    Charge:
      type: object
      required:
        - id
        - amount
        - currency
        - status
      properties:
        id:
          type: string
          example: ch_01HXYZ
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
